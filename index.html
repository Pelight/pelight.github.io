<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Справочник Daggerheart</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@600;700;800&family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar with section tabs and search; content as a single column of cards on phones, grid on wide screens. */
:root{
  --bg:#F2F1F6; --surface:#FFFFFF; --surface2:#E8E6F0; --fg:#1C1A2B; --muted:#5D5A70; --line:#D6D3E2;
  --accent:#4A3FA6; --accent-fg:#FFFFFF; --good:#2E7D4F; --mid:#9A6B00; --hard:#B23A3A;
  --display:'Alegreya',Georgia,'Times New Roman',serif; --body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13121C; --surface:#1D1B2B; --surface2:#2A2740; --fg:#ECE9F7; --muted:#A8A4BE; --line:#363350;
  --accent:#A99CFF; --accent-fg:#14122A; --good:#6CC592; --mid:#E0B64D; --hard:#F08A8A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13121C; --surface:#1D1B2B; --surface2:#2A2740; --fg:#ECE9F7; --muted:#A8A4BE; --line:#363350;
  --accent:#A99CFF; --accent-fg:#14122A; --good:#6CC592; --mid:#E0B64D; --hard:#F08A8A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
a{color:var(--accent)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand b{font-family:var(--display);font-size:22px;font-weight:800}
.brand span{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.tabs a{flex:none;text-decoration:none;color:var(--fg);padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px;background:var(--surface)}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.search{width:100%;margin-top:8px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}
main{max-width:1100px;margin:0 auto;padding-top:18px}
.lead{color:var(--muted);margin:6px 0 16px;max-width:65ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:5px 11px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;text-decoration:none;color:inherit}
a.card:hover{border-color:var(--accent)}
.card h3{font-size:22px}
.card .c{border-left:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.lv-Простой{color:var(--good);border-color:var(--good)}.lv-Средний{color:var(--mid);border-color:var(--mid)}.lv-Сложный{color:var(--hard);border-color:var(--hard)}
.small{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.stat b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.stat.wide b{font-size:15px;font-family:var(--body);font-weight:500}
.block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.block h3{font-size:19px;margin-bottom:6px}
.block p{margin:6px 0;white-space:pre-wrap;max-width:70ch}
h2.sec{font-size:26px;margin:28px 0 10px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gal.big{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.thumb{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;cursor:zoom-in;display:block;width:100%;min-width:0}
.thumb img{display:block;width:100%;height:auto;background:var(--surface2);min-height:120px}
.cap{font-size:12px;color:var(--muted);margin:4px 2px 0}
.sub{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.sub:first-of-type{border-top:0;padding-top:0}
.back{display:inline-block;margin-bottom:6px;font-size:14px}
table{border-collapse:collapse;width:100%}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,9,18,.94);overflow:auto;padding:calc(48px + env(safe-area-inset-top,0px)) 8px 24px;text-align:center}
.lb img{max-width:none;width:min(100%,1100px);height:auto;touch-action:pinch-zoom pan-x pan-y}
.lb button{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:51;padding:8px 14px;border-radius:999px;border:0;background:#fff;color:#111;font:inherit;font-weight:600}
.res{display:grid;gap:8px}
.res a{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--fg)}
.res small{color:var(--muted);display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:480px){h2.sec{font-size:23px}.gal{grid-template-columns:repeat(2,1fr)}.gal.big{grid-template-columns:1fr}}
</style>
</head><body>

  const sheetCaps=["Лист персонажа","Руководство по классу","Дополнительно","Дополнительно"];
  return `<a class="back" href="#classes">← Все классы</a><h1 style="font-size:36px">${esc(c.name)}</h1>
  <div class="row" style="margin-top:6px"><span class="pill">${esc(r.Набор)}</span><span class="pill lv-${r["Сложность для новичка"]}">Сложность: ${esc(r["Сложность для новичка"].toLowerCase())}</span><span class="pill">Домены: ${esc(r.Домены)}</span></div>
  <div class="stats"><div class="stat"><small>Раны (старт)</small><b>${r["Раны (старт)"]}</b></div><div class="stat"><small>Уклонение (старт)</small><b>${r["Уклонение (старт)"]}</b></div><div class="stat wide" style="grid-column:span 2"><small>Предмет класса</small><b>${esc(r["Предмет класса"])}</b></div></div>
  <div class="block"><h3>${esc(hope[0].replace("СВОЙСТВО НАДЕЖДЫ:","Свойство Надежды:"))}</h3><p>${esc(hope.slice(1).join("\n"))}</p></div>
  <div class="block"><h3>${esc(feat[0].replace("СВОЙСТВА КЛАССА:","Свойства класса:"))}</h3><p>${esc(feat.slice(1).join("\n"))}</p></div>
  <div class="block"><h3>Что отслеживать за столом</h3><p>${esc(r["Что отслеживать за столом"])}. Это моя подсказка, в книге такого раздела нет.</p></div>
  <h2 class="sec">Подклассы</h2>
  ${sub.map((s,k)=>`<div class="block sub"><h3>${esc(s.name)}</h3><p class="small">${esc(s.pitch)}</p><p><b>Атрибут магии:</b> ${esc(s.attr)}</p><p>${esc(s.key)}</p>${c.substrips[k]?thumbs([c.substrips[k]],true):""}</div>`).join("")}
  <h2 class="sec">Лист персонажа и руководство</h2>${thumbs(c.sheet,true,sheetCaps)}
  ${c.domcards.map(d=>`<h2 class="sec">${esc(d.title.split("|")[0].replace("Домен ","Домен ").trim().replace(/^Домен (.)(.*)$/,(m,a,b)=>"Домен "+a+b.toLowerCase()))}</h2><p class="small">${esc((d.title.split("|")[1]||"").trim())}</p>${thumbs(d.imgs,false)}`).join("")}`}
let fcls="Все";
function viewSubs(){
  const names=["Все",...Object.keys(D.subs).map(cap)];
  const rows=[];Object.entries(D.subs).forEach(([cl,arr])=>arr.forEach(s=>rows.push({cl,...s})));
  const shown=rows.filter(x=>fcls==="Все"||cap(x.cl)===fcls);
  const ix=n=>D.classes.findIndex(c=>c.row.Класс===n);
  return `<h1 style="font-size:32px">Подклассы</h1><p class="lead">32 подкласса. Атрибут магии и ключевые умения прочитаны с карточек.</p>
  <div class="chips">${names.map(n=>`<button class="chip" data-fc="${n}" aria-pressed="${fcls===n}" type="button">${n}</button>`).join("")}</div>
  <div class="grid">${shown.map(s=>`<a class="card" href="#${slug(ix(s.cl))}"><h3>${esc(s.name)}</h3><div class="row"><span class="pill">${esc(cap(s.cl))}</span><span class="pill">Атрибут магии: ${esc(s.attr)}</span></div><div class="small">${esc(s.pitch)}</div><div>${esc(s.key)}</div></a>`).join("")}</div>`}
function viewDomains(){return `<h1 style="font-size:32px">Домены</h1><p class="lead">Какие классы берут какой домен и с каким доменом идёт пара.</p>
  <div class="tw"><table><thead><tr><th>Домен</th><th>Классы</th><th>Пара домена</th></tr></thead><tbody>${D.doms.map(d=>`<tr><td><b>${esc(cap(d[0]))}</b></td><td>${esc(d[1])}</td><td>${esc(d[2])}</td></tr>`).join("")}</tbody></table></div>`}
function viewOrigins(){return `<h1 style="font-size:32px">Происхождения и сообщества</h1><p class="lead">Карточки основной книги и Hope & Fear. Нажмите на карточку, чтобы увеличить.</p>`+D.origins.map(g=>`<h2 class="sec">${esc(g.title)}</h2>${thumbs(g.cards.map(c=>c.img),false,g.cards.map(c=>c.n))}`).join("")}
function viewExp(){return `<h1 style="font-size:32px">Карточки Опыта</h1><p class="lead">Примеры для шага 7 создания персонажа: выберите два Опыта или придумайте свои, каждому даётся +2.</p>`+D.exp.map(g=>`<h2 class="sec">${esc(g.title)} (${g.cards.length})</h2>${thumbs(g.cards,false)}`).join("")}
function search(q){
  q=q.trim().toLowerCase();if(q.length<2)return null;const out=[];
  D.classes.forEach((c,i)=>{const t=[c.name,c.row.Домены,c.hope,c.feat,c.row["Что отслеживать за столом"],c.row["Предмет класса"]].join(" ").toLowerCase();if(t.includes(q))out.push([c.name,"Класс, "+c.row.Набор,slug(i)])});
  Object.entries(D.subs).forEach(([cl,arr])=>arr.forEach(s=>{const t=[s.name,s.pitch,s.attr,s.key].join(" ").toLowerCase();if(t.includes(q))out.push([s.name,"Подкласс, "+cap(cl),slug(D.classes.findIndex(c=>c.row.Класс===cl))])}));
  D.origins.forEach(g=>g.cards.forEach(c=>{if(c.n.toLowerCase().includes(q))out.push([c.n,g.title,"origins"])}));
  return out}
function render(){
  const h=(location.hash||"#classes").slice(1);const app=$("#app");const q=$("#q").value;
  const m=/^class-(\d+)$/.exec(h);let cur=m?"classes":h;if(!TABS.some(t=>t[0]===cur))cur="classes";tabs(cur);
  const res=search(q);
  if(res){app.innerHTML=`<h1 style="font-size:28px">Найдено: ${res.length}</h1><div class="res">${res.map(r=>`<a href="#${r[2]}"><b>${esc(r[0])}</b><small>${esc(r[1])}</small></a>`).join("")||"<p>Ничего не найдено.</p>"}</div>`;return}
  if(m&&D.classes[+m[1]-1])app.innerHTML=viewClass(+m[1]-1);
  else app.innerHTML=({classes:viewClasses,subclasses:viewSubs,domains:viewDomains,origins:viewOrigins,experience:viewExp})[cur]();
  if(!m)window.scrollTo(0,0)}
addEventListener("hashchange",()=>{$("#q").value="";render();window.scrollTo(0,0)});
$("#q").addEventListener("input",render);
document.addEventListener("click",e=>{
  const z=e.target.closest("[data-z]");if(z){$("#lbi").src=z.dataset.z;$("#lb").hidden=false;$("#lb").scrollTop=0;return}
  if(e.target.id==="lbx"||e.target.id==="lb"){$("#lb").hidden=true;return}
  const b=e.target.closest("[data-fb]");if(b){fb=b.dataset.fb;render();return}
  const l=e.target.closest("[data-fl]");if(l){fl=l.dataset.fl;render();return}
  const f=e.target.closest("[data-fc]");if(f){fcls=f.dataset.fc;render()}});
addEventListener("keydown",e=>{if(e.key==="Escape")$("#lb").hidden=true});
render();
</script>

</body></html>
